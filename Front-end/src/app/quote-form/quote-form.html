<form class="form" [formGroup]="newquote" (ngSubmit)="onSubmit()">
    <div class="form-group">
        <label class="label" for="Quotetxt">The Quote</label>
        <input class="input" id="Quotetxt" formControlName="quoteText" type="text">
    </div>
    <div class="form-group">
        <label class="label" for="Writer">Writer</label>
        <input class="input" id="Writer" formControlName="writer" type="text">
    </div>
    <button class="btn-primary" type="submit">Submit</button>
</form>
