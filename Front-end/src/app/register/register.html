<form (ngSubmit)="onRegister()">
  <div>
    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      name="username"
      [(ngModel)]="username"
      required
    />
  </div>

  <div>
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      required
    />
  </div>

  <button type="submit">Register</button>

  @if (message) {
    <p>{{ message }}</p>
  }
</form>
