
  <div class="container">
    <!-- Header/Action Area -->
    <div class="actions">
      <a href="/newbook" class="btn-add">+ Add New Book</a>
    </div>
    <!-- Cards Grid -->
    <div class="book-grid">
      @for(book of books(); track book.bookId) {
      <div class="book-card">
        <div class="card-header">
          <span class="id-badge">#{{ book.bookId }}</span>
        </div>

        <h3 class="title">{{ book.title }}</h3>

        <div class="details">
          <p><span class="label">Author:</span> {{ book.author }}</p>
          <p>
            <span class="label">Status:</span>
            <span class="status-badge" [class.read]="book.read">
              {{ book.read ? 'Read' : 'To Read' }}
            </span>
          </p>
        </div>

        <div class="card-actions">
          <button class="btn-edit" (click)="Editbook(book)">Edit</button>
          <button class="btn-delete" (click)="Deletebook(book.bookId)">Delete</button>
        </div>
      </div>
      }
    </div>
  </div>
