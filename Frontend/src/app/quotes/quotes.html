<!-- Quotes Component -->
<div class="quotes-container">
  <div class="actions">
    <a href="/newquote" class="btn-add">+ Add New Quote</a>
  </div>
  <div class="quotesgrid">

    @for(q of quotes(); track q.quoteId){
      <div class="quote-card">
        <div class="card-header">
          <span>#{{q.quoteId}}</span>
        </div>
        <div class="quote-content">
          <p class="quote-text">" {{q.quoteText}} "</p>
          <p class="quote-author">Author:{{q.writer}}</p>
        </div>
        <div class="btn-container">
          <button class="btn-edit" (click)="Editquote(q)">Edit</button>
          <button class="btn-delete" (click)="Deletequote(q.quoteId)">Delete</button>
        </div>
      </div>}
    </div>
</div>
