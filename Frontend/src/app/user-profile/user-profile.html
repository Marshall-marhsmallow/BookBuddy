<div class="banner">
  <h2>Welcome!, {{ loggedUser().username }}</h2>
  <button class="logout-btn" (click)="logout()">Logout</button>
</div>
<div class="view-switcher">
  <button [class.active]="activeView() === 'books'" (click)="setView('books')">Books</button>
  <button [class.active]="activeView() === 'quotes'" (click)="setView('quotes')">Quotes</button>
</div>
<div class="content-sec">
  @switch(activeView()){
    @case ('books'){
      <app-bookslist/>
    }
    @case ('quotes'){
      <app-quotes/>
    }
  }
</div>
